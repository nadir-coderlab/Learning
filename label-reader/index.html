<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B3450">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>مختبر الفحوصات الموحد</title>
<link rel="icon" href="brand/mark-color.png">
<link rel="apple-touch-icon" href="brand/mark-color.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
@font-face{font-family:"Thmanyah Display";src:url("brand/thmanyahserifdisplay-Black.otf") format("opentype");font-weight:900;font-display:swap}
@font-face{font-family:"Thmanyah Text";src:url("brand/thmanyahseriftext-Bold.otf") format("opentype");font-weight:700;font-display:swap}
:root{
  --deep:#0B3450; --mid:#15508A; --primary:#1D86B5; --teal:#107793; --teal-l:#3AC0C3; --sky:#2FA9E0;
  --bg:#F4F9FB; --tint:#E3EEF4; --line:#DCE7EE; --ink:#13283B; --muted:#5B6B7C; --white:#FFFFFF;
  --ok:#0E8F6E; --ok-bg:#E3F6F0;
  --f-display:"Thmanyah Display","Thmanyah Text","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-head:"Thmanyah Text","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-ui:"IBM Plex Sans Arabic",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  --guide-w:min(86vw,500px);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--deep);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--teal-l);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ===== camera stage ===== */
#stage{position:fixed;inset:0;background:#06121C}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#guide{position:absolute;left:50%;top:40%;width:var(--guide-w);aspect-ratio:2.2/1;transform:translate(-50%,-50%);
  border-radius:16px;box-shadow:0 0 0 200vmax rgba(6,22,36,.66);pointer-events:none}
#guide .c{position:absolute;width:30px;height:30px;border:4px solid var(--teal-l);transition:border-color .2s}
#guide .c.tr{top:-4px;right:-4px;border-left:0;border-bottom:0;border-top-right-radius:18px}
#guide .c.tl{top:-4px;left:-4px;border-right:0;border-bottom:0;border-top-left-radius:18px}
#guide .c.br{bottom:-4px;right:-4px;border-left:0;border-top:0;border-bottom-right-radius:18px}
#guide .c.bl{bottom:-4px;left:-4px;border-right:0;border-top:0;border-bottom-left-radius:18px}
#guide .beam{position:absolute;left:5%;right:5%;height:2px;top:12%;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--teal-l),transparent);box-shadow:0 0 12px var(--teal-l);animation:beam 1.5s ease-in-out infinite alternate}
#guide.locked .c{border-color:#7CF0C9}
#guide.locked{box-shadow:0 0 0 200vmax rgba(6,22,36,.78),0 0 0 2px #7CF0C9,0 0 28px rgba(124,240,201,.45)}
#guide.locked .beam,#guide.idle .beam{display:none}
@keyframes beam{to{top:88%}}

#bar{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(var(--safe-t) + 10px) var(--gut-r) 26px var(--gut-l);
  background:linear-gradient(180deg,rgba(11,52,80,.96) 0%,rgba(11,52,80,.75) 55%,rgba(11,52,80,0) 100%)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:36px;height:36px;flex:none}
.brand b{display:block;font-family:var(--f-head);font-weight:700;color:#fff;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:#9FD4E6;font-size:11px;letter-spacing:.06em;direction:ltr;text-align:right}
.tools{display:flex;gap:8px}
.ib{width:42px;height:42px;border-radius:13px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#fff;
  display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ib svg{width:21px;height:21px}
.ib[aria-pressed="true"]{background:#FFE08A;color:#3B2A00;border-color:#FFE08A}

#status{position:absolute;left:50%;transform:translateX(-50%);top:calc(40% - var(--guide-w)/4.4 - 48px);z-index:2;
  display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;
  background:rgba(11,52,80,.72);border:1px solid rgba(58,192,195,.35);color:#E6F6FA;font-size:13px;font-weight:600;white-space:nowrap;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dot{width:8px;height:8px;border-radius:50%;background:#7E93A6}
.dot.live{background:var(--teal-l);animation:pulse 1.4s ease-out infinite}
.dot.done{background:#7CF0C9}
.dot.err{background:#FF8A8A}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(58,192,195,.55)}100%{box-shadow:0 0 0 9px rgba(58,192,195,0)}}

#live{position:absolute;left:50%;transform:translateX(-50%);top:calc(40% + var(--guide-w)/4.4 + 16px);width:var(--guide-w);z-index:2;display:grid;gap:7px}
.lv{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;
  background:rgba(11,30,46,.7);border:1px solid rgba(255,255,255,.1);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lv span.k{font-size:11px;color:#8FC6DA;font-weight:600}
.lv b{font-weight:600;font-size:14px;min-width:0;overflow-wrap:anywhere}
.lv b.n{font-family:var(--f-num);letter-spacing:.04em}
.ticks{display:flex;gap:3px}
.ticks i{width:6px;height:14px;border-radius:2px;background:rgba(255,255,255,.18)}
.ticks i.on{background:var(--teal-l)}

/* ===== start screen ===== */
#gate{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  padding:calc(var(--safe-t) + 24px) var(--gut-r) calc(var(--safe-b) + 24px) var(--gut-l);text-align:center;color:#fff;overflow:hidden;
  background:
    radial-gradient(120% 70% at 50% 108%,rgba(58,192,195,.55) 0%,rgba(58,192,195,0) 60%),
    radial-gradient(90% 55% at 100% 0%,rgba(47,169,224,.35) 0%,rgba(47,169,224,0) 60%),
    linear-gradient(170deg,#0B3450 0%,#0F4470 50%,#15508A 100%)}
#gate[hidden]{display:none}
#gate::before{content:"";position:absolute;inset:-20%;pointer-events:none;opacity:.10;
  background:repeating-radial-gradient(circle at 50% 38%,#fff 0 1px,transparent 1px 44px)}
.g-logo{width:min(62vw,260px);height:auto;position:relative;filter:drop-shadow(0 10px 30px rgba(0,0,0,.25))}
.g-title{position:relative;display:grid;gap:8px}
.g-title h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(28px,8.4vw,38px);line-height:1.2;text-wrap:balance}
.g-title p{margin:0;font-size:12px;letter-spacing:.32em;color:#A9DCEB;direction:ltr;text-transform:uppercase}
.g-rule{width:56px;height:3px;border-radius:3px;background:var(--teal-l);margin:4px auto 0}
.start{position:relative;display:inline-flex;align-items:center;gap:12px;padding:16px 30px;border-radius:999px;border:0;cursor:pointer;
  background:#fff;color:var(--deep);font-weight:700;font-size:18px;box-shadow:0 14px 34px rgba(3,20,34,.35),0 0 0 6px rgba(255,255,255,.12)}
.start svg{width:24px;height:24px;color:var(--primary)}
.start[disabled]{opacity:.85}
.start .sp{width:20px;height:20px;border-radius:50%;border:3px solid var(--tint);border-top-color:var(--primary);animation:spin .8s linear infinite;display:none}
.start.loading .sp{display:block}.start.loading svg{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
#gateMsg{position:relative;margin:0;font-size:13px;color:#CDEBF4;min-height:18px}

/* ===== result sheet ===== */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--bg);border-radius:24px 24px 0 0;
  padding:10px var(--gut-r) calc(var(--safe-b) + 18px) var(--gut-l);box-shadow:0 -18px 40px rgba(3,20,34,.35);
  transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:82%;overflow:auto}
#sheet.open{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:#C7D6E1;margin:0 auto 14px}
.s-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.s-brand{display:flex;align-items:center;gap:8px;min-width:0}
.s-brand img{width:28px;height:28px}
.s-brand b{font-family:var(--f-head);font-weight:700;color:var(--deep);font-size:15px;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-size:13px;font-weight:700;white-space:nowrap}
.badge svg{width:15px;height:15px}

.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(11,52,80,.08)}
.card-top{height:6px;background:linear-gradient(90deg,var(--deep),var(--primary),var(--teal-l))}
.rows{padding:6px 14px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .k{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px}
.row .v{display:block;text-align:right;font-size:19px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.row .v.name{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:20px;letter-spacing:.02em}
.row .v.num{font-family:var(--f-num);font-weight:700;font-size:24px;letter-spacing:.06em;color:var(--deep);font-variant-numeric:tabular-nums}
.cp{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--mid);display:grid;place-items:center;cursor:pointer}
.cp svg{width:19px;height:19px}
.cp.done{background:var(--ok-bg);color:var(--ok);border-color:#BFE8DA}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin:10px 4px 0;font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:14px}
.btn{border-radius:15px;border:1.5px solid var(--line);background:#fff;color:var(--mid);padding:14px;font-weight:700;font-size:16px;cursor:pointer;min-height:54px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px}
.btn.pri{border:0;color:#fff;background:linear-gradient(135deg,var(--mid),var(--primary));box-shadow:0 8px 20px rgba(21,80,138,.3)}

.hist{margin-top:18px}
.hist summary{display:flex;align-items:center;justify-content:space-between;color:var(--deep);font-family:var(--f-head);font-weight:700;font-size:15px;cursor:pointer;padding:8px 2px;list-style:none}
.hist summary::-webkit-details-marker{display:none}
.hist summary .cnt{font-family:var(--f-ui);font-size:12px;font-weight:700;color:var(--mid);background:var(--tint);border-radius:999px;padding:2px 10px}
.hist ul{list-style:none;margin:6px 0 0;padding:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hist li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist .hn{font-family:var(--f-num);font-weight:700;font-size:15px;color:var(--deep);text-align:right}
.hist .hs{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.hist .empty{display:block;text-align:center;color:var(--muted);font-size:13px;padding:14px}
.hist-tools{display:flex;justify-content:space-between;margin-top:6px}
.link{background:none;border:0;color:var(--primary);font-weight:700;font-size:13px;padding:8px 2px;cursor:pointer}

#toast{position:absolute;left:50%;bottom:calc(var(--safe-b) + 26px);transform:translate(-50%,10px);z-index:6;background:var(--deep);color:#fff;border-radius:999px;
  padding:9px 16px;font-size:13px;font-weight:700;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#guide .beam,.dot.live,.start .sp{animation:none}#sheet,#toast{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <div id="guide" class="idle"><i class="c tr"></i><i class="c tl"></i><i class="c br"></i><i class="c bl"></i><div class="beam"></div></div>

  <header id="bar">
    <div class="brand">
      <img src="brand/mark-white.png" alt="">
      <div><b>مختبر الفحوصات الموحد</b><small>Unified Testing Laboratory</small></div>
    </div>
    <div class="tools">
      <button class="ib" id="torch" type="button" aria-label="الفلاش" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
      </button>
      <button class="ib" id="histBtn" type="button" aria-label="السجل">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      </button>
    </div>
  </header>

  <div id="status"><span class="dot" id="dot"></span><span id="state">جاهز</span></div>

  <div id="live" hidden>
    <div class="lv"><span class="k">الموقع</span><b id="lLoc">—</b><span class="ticks" id="tLoc"></span></div>
    <div class="lv"><span class="k">الاسم</span><b class="ltr" id="lName">—</b><span class="ticks" id="tName"></span></div>
    <div class="lv"><span class="k">الرقم</span><b class="n ltr" id="lNum">—</b><span class="ticks" id="tNum"></span></div>
  </div>

  <section id="gate">
    <img class="g-logo" src="brand/logo-white.png" alt="تجمع المدينة المنورة الصحي">
    <div class="g-title">
      <h1>مختبر الفحوصات الموحد</h1>
      <p>Unified Testing Laboratory</p>
      <div class="g-rule"></div>
    </div>
    <button class="start" id="startBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
      <span class="sp"></span>
      <span id="startTxt">ابدأ المسح</span>
    </button>
    <p id="gateMsg"></p>
  </section>

  <div id="sheet" aria-live="polite">
    <div class="grab"></div>
    <div id="result">
      <div class="s-head">
        <div class="s-brand"><img src="brand/mark-color.png" alt=""><b>مختبر الفحوصات الموحد</b></div>
        <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>تم التأكيد</span>
      </div>
      <div class="card">
        <div class="card-top"></div>
        <div class="rows">
          <div class="row"><div><span class="k">الموقع</span><span class="v" id="rLoc">—</span></div><button class="cp" type="button" data-k="loc" aria-label="نسخ الموقع"></button></div>
          <div class="row"><div><span class="k">الاسم</span><span class="v name ltr" id="rName">—</span></div><button class="cp" type="button" data-k="name" aria-label="نسخ الاسم"></button></div>
          <div class="row"><div><span class="k">الرقم</span><span class="v num ltr" id="rNum">—</span></div><button class="cp" type="button" data-k="num" aria-label="نسخ الرقم"></button></div>
        </div>
      </div>
      <div class="meta"><span id="mConf">—</span><span id="mTime">—</span></div>
      <div class="acts">
        <button class="btn" id="copyAll" type="button">نسخ الكل</button>
        <button class="btn pri" id="again" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
          الملصق التالي
        </button>
      </div>
    </div>
    <details class="hist" id="hist">
      <summary><span>السجل</span><span class="cnt" id="histCnt">0</span></summary>
      <ul id="histList"></ul>
      <div class="hist-tools"><button class="link" id="copyHist" type="button">نسخ القائمة</button><button class="link" id="clearHist" type="button">مسح السجل</button></div>
    </details>
  </div>
  <div id="toast"></div>
</div>

<script src="tess/tesseract.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $("video"), guide = $("guide");
  const NEED = 2;           // identical reads required to confirm each field
  const WINDOW = 12;        // frames kept for voting
  let engW = null, engW2 = null, araW = null, stream = null, track = null;
  let scanning = false, busy = false, frames = [], t0 = 0, current = null, frameCount = 0, readyFrame = -1;

  const setState = (t, mode) => { $("state").textContent = t; $("dot").className = "dot" + (mode ? " " + mode : ""); };
  const COPY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
  const OK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  const toast = t => { const e=$("toast"); e.textContent=t; e.classList.add("show"); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove("show"),1300); };

  // ---------- engines ----------
  const base = new URL(".", location.href).href;
  async function loadEngines(){
    const opts = { workerPath: base+"tess/worker.min.js", corePath: base+"tess/core", langPath: base+"tess/lang", workerBlobURL: false };
    const WL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ";
    const [e, e2, a] = await Promise.all([Tesseract.createWorker("eng",1,opts), Tesseract.createWorker("eng",1,opts), Tesseract.createWorker("ara",1,opts)]);
    await Promise.all([
      e.setParameters({ tessedit_pageseg_mode: "6", tessedit_char_whitelist: WL }),
      e2.setParameters({ tessedit_pageseg_mode: "6", tessedit_char_whitelist: WL }),
      a.setParameters({ tessedit_pageseg_mode: "6" })
    ]);
    engW = e; engW2 = e2; araW = a;
  }

  // ---------- camera ----------
  async function startCamera(){
    stream = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080} } });
    video.srcObject = stream; await video.play();
    track = stream.getVideoTracks()[0];
    try {
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.torch) $("torch").hidden = false;
      if (caps.focusMode && caps.focusMode.includes("continuous")) track.applyConstraints({ advanced:[{focusMode:"continuous"}] }).catch(()=>{});
    } catch(_){}
  }
  $("torch").addEventListener("click", async e => {
    const b = e.currentTarget, on = b.getAttribute("aria-pressed") !== "true";
    try { await track.applyConstraints({ advanced:[{ torch:on }] }); b.setAttribute("aria-pressed", String(on)); } catch(_){}
  });

  // ---------- crop the guide area out of the video ----------
  function grab(width){
    const vw = video.videoWidth, vh = video.videoHeight; if (!vw || !vh) return null;
    const sr = video.getBoundingClientRect(), gr = guide.getBoundingClientRect();
    const s = Math.max(sr.width / vw, sr.height / vh);              // object-fit: cover
    const ox = (sr.width - vw * s) / 2, oy = (sr.height - vh * s) / 2;
    const sx = (gr.left - sr.left - ox) / s, sy = (gr.top - sr.top - oy) / s;
    const sw = gr.width / s, sh = gr.height / s;
    const c = document.createElement("canvas");
    c.width = width; c.height = Math.round(width * sh / sw);
    const g = c.getContext("2d", { willReadFrequently:true });
    g.filter = "grayscale(1)";
    g.drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
    return c;
  }

  // black/white copy with the label's ruled lines removed
  function cleaned(src){
    const W = src.width, H = src.height;
    const im = src.getContext("2d").getImageData(0, 0, W, H), d = im.data;
    const hist = new Uint32Array(256), gray = new Uint8Array(W*H);
    for (let i=0, j=0; i<d.length; i+=4, j++){ gray[j] = d[i]; hist[d[i]]++; }
    const pct = q => { let acc=0, lim=q*W*H; for (let v=0; v<256; v++){ acc+=hist[v]; if (acc>=lim) return v; } return 255; };
    const thr = (pct(0.90) + pct(0.03)) / 2;
    const dark = new Uint8Array(W*H); for (let j=0; j<W*H; j++) dark[j] = gray[j] < thr ? 1 : 0;
    const keep = dark.slice();
    const hl = Math.max(40, W>>3), vl = Math.max(30, (H/5)|0);
    for (let y=0; y<H; y++){ let x=0; while (x<W){ if (dark[y*W+x]){ const s0=x; while (x<W && dark[y*W+x]) x++;
      if (x-s0 >= hl) for (let yy=Math.max(0,y-1); yy<=Math.min(H-1,y+1); yy++) for (let xx=s0; xx<x; xx++) keep[yy*W+xx]=0; } else x++; } }
    for (let x=0; x<W; x++){ let y=0; while (y<H){ if (dark[y*W+x]){ const s0=y; while (y<H && dark[y*W+x]) y++;
      if (y-s0 >= vl) for (let yy=s0; yy<y; yy++) for (let xx=Math.max(0,x-1); xx<=Math.min(W-1,x+1); xx++) keep[yy*W+xx]=0; } else y++; } }
    for (let i=0, j=0; i<d.length; i+=4, j++){ const v = keep[j] ? 0 : 255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
    const c = document.createElement("canvas"); c.width = W; c.height = H; c.getContext("2d").putImageData(im, 0, 0);
    return c;
  }

  // ---------- parsing ----------
  // A read only counts when every word is confident and fully inside the frame (no cut-off text)
  function parseEng(data, W){
    const inside = w => w.bbox.x0 > W*0.03 && w.bbox.x1 < W*0.97;
    let num = "", name = "";
    for (const line of (data.lines || [])) {
      const ws = (line.words || []).map(w => ({...w, t: w.text.trim()})).filter(w => w.t);
      for (const w of ws) if (/^\d{8,13}$/.test(w.t) && w.confidence >= 80 && inside(w) && (!num || w.t.length === 11)) num = w.t;
      const letters = ws.filter(w => /^[A-Z]{2,}$/.test(w.t));
      if (letters.length >= 2 && letters.length === ws.filter(w => !/^\d+$/.test(w.t) && w.t.length > 1).length
          && letters.every(w => w.confidence >= 75 && inside(w))) {
        const cand = letters.map(w => w.t).join(" ");
        if (cand.length > name.length) name = cand;
      }
    }
    return { num, name };
  }
  function parseAra(data){
    // keep only confident Arabic words from the first line that has any
    for (const line of (data.lines || [])) {
      const ws = (line.words || []).filter(w => w.confidence >= 86 && /^[ء-ي]{3,}$/.test(w.text.trim()));
      if (ws.length) return ws.map(w => w.text.trim()).join(" ");
    }
    return "";
  }

  // ---------- voting ----------
  // a name or number is confirmed only when two different reading methods produced the same value
  const METHODS = ["R", "C", "S", "Q"];
  function tally(key){
    const c = {};
    frames.forEach(f => {
      if (key === "loc") { if (f.loc) { const v = c[f.loc] = c[f.loc] || {m:new Set(["x","y"]), n:0}; v.n++; } return; }
      METHODS.forEach(m => { const val = f[key+m]; if (val) { const v = c[val] = c[val] || {m:new Set(), n:0}; v.m.add(m); v.n++; } });
    });
    const e = Object.entries(c).sort((x,y) => y[1].n - x[1].n);
    const [best, v] = e[0] || ["", {m:new Set(), n:0}]; const second = e[1] ? e[1][1].n : 0;
    return { best, n: v.n, clear: v.m.size >= 2 && v.n >= NEED && v.n > second };
  }
  function ticks(el, n){
    el.textContent = ""; for (let i=0;i<NEED+1;i++){ const x=document.createElement("i"); if (i<n) x.className="on"; el.append(x); }
  }

  async function loop(){
    if (!scanning) return;
    if (!busy && video.readyState >= 2){
      busy = true;
      try{
        // sizes shift a little every frame so each pass sees the label differently
        const wE = [440,416,464][frameCount % 3], wQ = [360,340,384][frameCount % 3];
        const imgE = grab(wE), imgA = grab(380);
        if (imgE){
          // four views of the same frame: plain and line-free, at two sizes
          const imgQ = grab(wQ), imgC = cleaned(imgE), imgS = cleaned(imgQ);
          const [[rR, rS], [rC, rQ], rA] = await Promise.all([
            engW.recognize(imgE).then(async a => [a, await engW.recognize(imgS)]),
            engW2.recognize(imgC).then(async a => [a, await engW2.recognize(imgQ)]),
            araW.recognize(imgA)
          ]);
          if (!scanning) { busy = false; return; }
          const R = parseEng(rR.data, wE), C = parseEng(rC.data, wE), S = parseEng(rS.data, wQ), Q = parseEng(rQ.data, wQ);
          const p = { numR:R.num, nameR:R.name, numC:C.num, nameC:C.name, numS:S.num, nameS:S.name, numQ:Q.num, nameQ:Q.name, loc: parseAra(rA.data) };
          frames.push(p); if (frames.length > WINDOW) frames.shift(); frameCount++;
          const N = tally("num"), M = tally("name"), L = tally("loc");
          $("lNum").textContent = N.best || "—"; $("lName").textContent = M.best || "—"; $("lLoc").textContent = L.best || "—";
          ticks($("tNum"), N.n); ticks($("tName"), M.n); ticks($("tLoc"), L.n);
          if (N.clear && M.clear && readyFrame < 0) readyFrame = frameCount;
          const locReady = L.clear || (readyFrame >= 0 && frameCount - readyFrame >= 4);
          if (N.clear && M.clear && locReady) lock({ num:N.best, name:M.best, loc:L.clear ? L.best : "", votes:Math.min(N.n,M.n) });
        }
      }catch(err){ console.warn(err); }
      busy = false;
    }
    requestAnimationFrame(loop);
  }

  function beginScan(){
    frames = []; current = null; t0 = performance.now(); frameCount = 0; readyFrame = -1;
    ["lNum","lName","lLoc"].forEach(id => $(id).textContent = "—");
    ["tNum","tName","tLoc"].forEach(id => ticks($(id), 0));
    $("sheet").classList.remove("open"); $("live").hidden = false;
    guide.className = ""; setState("يقرأ الملصق", "live");
    scanning = true; requestAnimationFrame(loop);
  }

  function lock(r){
    scanning = false; current = r;
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    guide.className = "locked"; setState("تم التأكيد", "done");
    if (navigator.vibrate) navigator.vibrate(60);
    $("rLoc").textContent = r.loc || "—"; $("rName").textContent = r.name; $("rNum").textContent = r.num;
    $("mConf").textContent = r.votes + " قراءات متطابقة · " + r.num.length + " خانة";
    $("mTime").textContent = "خلال " + secs + " ثانية";
    document.querySelectorAll(".row .cp").forEach(b => { b.innerHTML = COPY_SVG; b.classList.remove("done"); });
    $("live").hidden = true; $("sheet").classList.add("open");
    addHist(r);
  }

  // ---------- history ----------
  const KEY = "label-reader-history";
  let hist = []; try { hist = JSON.parse(localStorage.getItem(KEY) || "[]"); if (!Array.isArray(hist)) hist = []; } catch(_){ hist = []; }
  const saveHist = () => { try { localStorage.setItem(KEY, JSON.stringify(hist.slice(0,100))); } catch(_){} };
  function addHist(r){ hist.unshift({ ...r, t: Date.now() }); hist = hist.slice(0,100); saveHist(); drawHist(); }
  function drawHist(){
    $("histCnt").textContent = hist.length;
    const ul = $("histList"); ul.textContent = "";
    if (!hist.length){ const li = document.createElement("li"), e = document.createElement("span"); e.className = "empty"; e.textContent = "لا توجد قراءات"; li.append(e); ul.append(li); return; }
    hist.forEach(r => {
      const li = document.createElement("li"), m = document.createElement("div");
      const n = document.createElement("div"); n.className = "hn"; n.textContent = r.num;
      const s = document.createElement("div"); s.className = "hs";
      s.textContent = [r.name, r.loc, new Date(r.t).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})].filter(Boolean).join(" · ");
      m.append(n, s);
      const b = document.createElement("button"); b.className = "cp"; b.type = "button"; b.innerHTML = COPY_SVG; b.setAttribute("aria-label","نسخ الرقم");
      b.onclick = () => copy(r.num, b);
      li.append(m, b); ul.append(li);
    });
  }
  drawHist();

  // ---------- copy ----------
  function copied(btn){
    toast("تم النسخ");
    if (btn && btn.classList.contains("cp")){ btn.innerHTML = OK_SVG; btn.classList.add("done"); setTimeout(() => { btn.innerHTML = COPY_SVG; btn.classList.remove("done"); }, 1400); }
  }
  async function copy(text, btn){
    if (!text) return;
    try { await navigator.clipboard.writeText(text); copied(btn); }
    catch(_){
      const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
      document.body.append(ta); ta.select(); try { document.execCommand("copy"); copied(btn); } catch(__){ toast("تعذر النسخ"); } ta.remove();
    }
  }
  document.querySelectorAll(".row .cp").forEach(b => b.innerHTML = COPY_SVG);
  document.querySelectorAll(".row .cp").forEach(b => b.addEventListener("click", () => current && copy(current[b.dataset.k] || "", b)));
  $("copyAll").onclick = () => current && copy([current.loc, current.name, current.num].filter(Boolean).join("\n"));
  $("copyHist").onclick = () => hist.length && copy(hist.map(r => [r.num, r.name, r.loc].filter(Boolean).join("\t")).join("\n"));
  let armed = false;
  $("clearHist").onclick = e => {
    const b = e.currentTarget;
    if (!armed){ armed = true; b.textContent = "اضغط مرة ثانية للتأكيد"; setTimeout(() => { armed = false; b.textContent = "مسح السجل"; }, 3000); return; }
    armed = false; b.textContent = "مسح السجل"; hist = []; saveHist(); drawHist();
  };
  $("again").onclick = beginScan;
  $("histBtn").onclick = () => {
    const sh = $("sheet");
    if (sh.classList.contains("open") && !current){ sh.classList.remove("open"); return; }
    $("result").hidden = !current; $("hist").open = true; sh.classList.add("open");
  };
  $("again").addEventListener("click", () => { $("result").hidden = false; });

  // ---------- start ----------
  $("startBtn").onclick = async () => {
    const sb = $("startBtn"); sb.disabled = true; sb.classList.add("loading"); $("startTxt").textContent = "جاري التجهيز"; $("gateMsg").textContent = ""; setState("جاري التجهيز", "");
    try {
      await Promise.all([startCamera(), loadEngines()]);
      $("gate").hidden = true; beginScan();
    } catch (err) {
      console.error(err);
      const sb = $("startBtn"); sb.disabled = false; sb.classList.remove("loading"); $("startTxt").textContent = "ابدأ المسح"; setState("تعذر التشغيل", "err");
      $("gateMsg").textContent = (err && err.name === "NotAllowedError") ? "تم رفض إذن الكاميرا" : "تعذر التشغيل: " + (err && (err.message || err.name) || err);
    }
  };
})();
</script>
</body>
</html>
