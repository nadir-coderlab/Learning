# مزامنة صفحتي «خطة ديولينجو» و«مدرّب ديولينجو» إلى فرع gh-pages (موقع GitHub Pages).
#
# الروابط:
#   https://nadir-coderlab.github.io/Learning/               ← الخطة (index.html)
#   https://nadir-coderlab.github.io/Learning/det-train.html ← المدرّب
#
# لماذا فرع gh-pages وليس النشر عبر actions/deploy-pages؟
# توكن الإجراءات لا يملك صلاحية تفعيل خدمة Pages لأول مرة
# (Create Pages site → Resource not accessible by integration)، بينما وجود
# فرع gh-pages يجعل GitHub يفعّلها تلقائيًا. وهذا الإجراء لا يحتاج سوى
# صلاحية الكتابة على المستودع، وهي متاحة للتوكن الافتراضي.
#
# لماذا صفحتان فقط وليس مجلد public كاملًا؟
# موقع البنات يستخدم مسارات مطلقة (/assets/... و /learn) تنكسر تحت مسار
# مشروع Pages (‎/Learning/‎)، بينما صفحتا الخطة والمدرّب مستقلتان تمامًا بلا
# أي ملف خارجي فتعملان من أي مسار. موقع البنات يبقى على Firebase Hosting.
name: Sync plan pages to gh-pages
on:
  push:
    branches: [main]
    paths:
      - "public/det.html"
      - "public/det-train.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

# مزامنة واحدة في كل مرة، بلا إلغاء مزامنة جارية
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: سحب فرع النشر
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: بناء الصفحات من main
        run: |
          git fetch origin main --depth=1
          git show origin/main:public/det.html > index.html
          # الخطة تشير إلى det.html نسبيًا؛ نوفّر الاسمين حتى يعمل الرابط من الصفحتين
          cp index.html det.html
          git show origin/main:public/det-train.html > det-train.html
          touch .nojekyll

      - name: دفع التحديث إن تغيّر شيء
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html det.html det-train.html .nojekyll
          if git diff --staged --quiet; then
            echo "::notice title=لا تغيير::صفحات النشر مطابقة للمصدر بالفعل."
            exit 0
          fi
          git commit -m "تحديث صفحات الخطة من ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
