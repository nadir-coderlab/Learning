<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رياضياتي 🧮 — من التأسيس إلى ثاني متوسط</title>
<meta name="description" content="موقع تأسيس رياضيات للأطفال: شرح مبسط، أمثلة محلولة، تدريب بتغذية فورية، اختبار إتقان، مراجعة ذكية، ونجوم ومكافآت — من ثالث ابتدائي إلى ثاني متوسط.">
<meta name="theme-color" content="#7c3aed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="math-gen.js?v=20260913"></script>
<style>
:root{--grad:linear-gradient(135deg,#7c3aed 0%,#db2777 55%,#f59e0b 100%);--grad-soft:linear-gradient(160deg,#ede9fe 0%,#fce7f3 55%,#fef3c7 100%);--purple:#7c3aed;--pink:#db2777;--amber:#f59e0b;--teal:#0d9488;--ink:#3b2b57;--muted:#8b7aa8;--card:#fff;--line:#eadff5;--ok:#16a34a;--ok-soft:#dcfce7;--err:#dc2626;--err-soft:#fee2e2;--radius:22px;--shadow:0 10px 30px rgba(124,58,237,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Cairo","Segoe UI",Tahoma,sans-serif;background:var(--grad-soft);background-attachment:fixed;color:var(--ink);min-height:100vh;font-size:18px;line-height:1.7}
button,input{font-family:inherit;font-size:inherit}
.top{background:var(--grad);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:20;box-shadow:0 4px 18px rgba(124,58,237,.25)}
.top .wrap{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top .brand{font-weight:900;font-size:20px;display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff}
.top .brand .mas{font-size:30px;line-height:1}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{background:rgba(255,255,255,.22);border-radius:999px;padding:2px 10px;font-weight:800;font-size:14px;white-space:nowrap}
.tbtn{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:999px;padding:4px 12px;font-weight:800;cursor:pointer;font-size:14px}
.container{max-width:820px;margin:0 auto;padding:16px 14px 60px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;border:3px solid #fff}
.card h2{font-size:22px;font-weight:900;margin-bottom:8px}
.card h3{font-size:18px;font-weight:900;margin:12px 0 6px}
.muted{color:var(--muted);font-weight:600;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--grad);color:#fff;border:0;border-radius:16px;padding:12px 20px;font-weight:900;font-size:18px;cursor:pointer;text-decoration:none;min-height:52px;box-shadow:0 6px 16px rgba(219,39,119,.25);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.big{width:100%;font-size:21px;padding:16px}
.btn.ghost{background:#fff;color:var(--purple);border:2px solid var(--purple);box-shadow:none}
.btn.teal{background:var(--teal);box-shadow:0 6px 16px rgba(13,148,136,.25)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ok{background:var(--ok)}
.hero{text-align:center}
.hero .big-mas{font-size:84px;line-height:1.1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero h1{font-size:28px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.field{margin:12px 0}
.field label{display:block;font-weight:800;margin-bottom:4px}
.field input{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:20px;font-weight:700;background:#fbf8ff}
.field input:focus{outline:0;border-color:var(--purple)}
.avatars{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.avatars button{font-size:34px;border:3px solid transparent;background:#fbf8ff;border-radius:16px;padding:6px 10px;cursor:pointer}
.avatars button.on{border-color:var(--pink);background:#fce7f3}
/* مهمة اليوم */
.mission{display:grid;gap:8px}
.mi{display:flex;align-items:center;gap:10px;background:#fbf8ff;border-radius:14px;padding:10px 12px;font-weight:800}
.mi .ck{font-size:24px;width:32px;text-align:center}
.mi.done{background:var(--ok-soft)}
.mi small{color:var(--muted);font-weight:700;margin-inline-start:auto}
.bar{height:12px;background:#eee7fb;border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:999px;transition:width .4s}
/* الخريطة */
.island{border-radius:var(--radius);padding:14px;margin-bottom:12px;background:#fff;box-shadow:var(--shadow);border:3px solid transparent}
.island .ih{display:flex;align-items:center;gap:10px;cursor:pointer}
.island .ih .em{font-size:40px;line-height:1}
.island .ih h3{font-size:19px;font-weight:900;margin:0}
.island .ih .muted{font-size:14px}
.island .ih .arrow{margin-inline-start:auto;font-weight:900;color:var(--muted)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.un{border-radius:16px;padding:10px;background:#fbf8ff;border:2px solid var(--line);cursor:pointer;text-align:center;position:relative;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.un .em{font-size:30px;line-height:1.2}
.un b{font-size:14px;line-height:1.35}
.un .st{font-size:14px;letter-spacing:1px}
.un.locked{opacity:.55;filter:grayscale(.6)}
.un.open{border-color:var(--pink);background:#fff0f7;box-shadow:0 0 0 4px #fce7f3}
.un.mastered{border-color:#fcd34d;background:#fffbeb}
.un.skipped{border-color:#a7f3d0;background:#ecfdf5}
.un .tag{position:absolute;top:-8px;inset-inline-end:-6px;background:var(--pink);color:#fff;font-size:11px;font-weight:900;border-radius:999px;padding:1px 8px}
/* الوحدة */
.stepper{display:flex;gap:6px;margin:10px 0 14px}
.stepper a{flex:1;text-align:center;background:#fbf8ff;border-radius:12px;padding:8px 4px;font-weight:800;font-size:14px;text-decoration:none;color:var(--muted);border:2px solid var(--line)}
.stepper a.on{color:#fff;background:var(--purple);border-color:var(--purple)}
.stepper a.done{color:var(--ok);border-color:#bbf7d0;background:#f0fdf4}
.lesson p{margin:8px 0;font-size:19px}
.lesson h4{font-size:19px;font-weight:900;color:var(--purple);margin:14px 0 4px}
.lesson .ex{background:#fff7ed;border:2px dashed var(--amber);border-radius:14px;padding:10px 14px;margin:10px 0;font-size:22px;text-align:center;font-weight:800}
.lesson .visw{text-align:center;margin:10px 0;overflow-x:auto}
.m{display:inline-block;font-weight:800;unicode-bidi:isolate;white-space:nowrap}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 3px;font-size:.9em}
.frac span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
.frac span:last-child{padding:0 4px}
.arr{display:inline-grid;gap:4px;padding:8px;background:#fbf8ff;border-radius:12px;margin:8px auto}
.arr span{width:14px;height:14px;border-radius:50%;background:var(--pink)}
.pv{border-collapse:collapse;margin:8px auto;font-weight:800}
.pv th{background:#ede9fe;padding:4px 12px;font-size:14px;border:2px solid #fff}
.pv td{background:#fff7ed;padding:4px 12px;font-size:26px;text-align:center;border:2px solid #fff}
.col{font-family:"Courier New",monospace;font-size:26px;font-weight:800;line-height:1.3;background:#fbf8ff;border-radius:14px;padding:10px 18px;display:inline-block;margin:8px auto;text-align:right;direction:ltr}
.tb{border-collapse:collapse;margin:8px auto;font-weight:800}
.tb th{background:#ede9fe;padding:4px 14px;border:2px solid #fff}
.tb td{background:#fbf8ff;padding:4px 14px;border:2px solid #fff;text-align:center}
.stp{padding-inline-start:24px;margin:8px 0}
.stp li{margin:4px 0}
.vis{max-width:100%;height:auto}
.tip{background:#ecfdf5;border-inline-start:5px solid var(--teal);border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:700}
.mist{background:#fff1f2;border-radius:14px;padding:10px 14px;margin:8px 0}
.mist .w{color:var(--err);font-weight:800}
.mist .r{color:var(--ok);font-weight:800}
.story{background:#fef3c7;border-radius:14px;padding:12px 14px;margin:10px 0;font-weight:700}
/* التدريب */
.qcard{text-align:center}
.qtext{font-size:22px;font-weight:800;margin:8px 0;line-height:1.8}
.qvis{margin:8px 0;overflow-x:auto}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 10px;flex-wrap:wrap}
.dots i{width:22px;height:22px;border-radius:50%;background:#eee7fb;display:inline-block;border:2px solid #fff}
.dots i.y{background:var(--ok)}
.dots i.n{background:var(--err)}
.dots i.c{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.ans{width:min(100%,320px);border:3px solid var(--purple);border-radius:16px;padding:12px;font-size:28px;font-weight:900;text-align:center;background:#fff;direction:ltr}
.ans:focus{outline:0;box-shadow:0 0 0 5px #ede9fe}
.keys{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.keys button{min-width:46px;height:42px;border-radius:12px;border:2px solid var(--line);background:#fbf8ff;font-weight:900;font-size:20px;cursor:pointer}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
.opts button{background:#fbf8ff;border:3px solid var(--line);border-radius:16px;padding:14px 10px;font-size:20px;font-weight:800;cursor:pointer;min-height:60px}
.opts button.on{border-color:var(--purple);background:#ede9fe}
.opts button.y{border-color:var(--ok);background:var(--ok-soft)}
.opts button.n{border-color:var(--err);background:var(--err-soft)}
.fb{border-radius:16px;padding:12px 14px;margin-top:12px;font-weight:800;text-align:start}
.fb.y{background:var(--ok-soft);color:#166534}
.fb.n{background:var(--err-soft);color:#991b1b}
.fb.h{background:#fef3c7;color:#92400e}
.fb ol{padding-inline-start:22px;margin-top:6px;font-weight:700}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.stars{font-size:30px;letter-spacing:2px}
.result{text-align:center}
.result .score{font-size:56px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.list{list-style:none}
.list li{background:#fbf8ff;border-radius:12px;padding:8px 12px;margin:6px 0;font-weight:700;font-size:15px}
/* المكافآت */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.bd{text-align:center;background:#fbf8ff;border-radius:16px;padding:10px;border:2px solid var(--line)}
.bd .em{font-size:36px;line-height:1.2;filter:grayscale(1);opacity:.4}
.bd.on .em{filter:none;opacity:1}
.bd b{font-size:13px;display:block}
.stage{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.stage span{font-size:26px;opacity:.3}
.stage span.on{opacity:1}
/* لوحة الوالد */
table.pt{width:100%;border-collapse:collapse;font-size:14px}
table.pt th,table.pt td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:start}
table.pt th{background:#fbf8ff;font-size:13px}
.pbar{height:10px;background:#eee7fb;border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--teal)}
textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:13px;direction:ltr;min-height:80px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.conf i{position:absolute;top:-12px;width:10px;height:14px;border-radius:3px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:15px}
.speak{background:#fff;border:2px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:16px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.nav a{background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;text-decoration:none;color:var(--purple);border:2px solid var(--line);font-size:15px}
@media (max-width:480px){body{font-size:17px}.container{padding:12px 10px 60px}.card{padding:14px}.units{grid-template-columns:repeat(2,1fr)}.qtext{font-size:20px}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <a class="brand" href="#home"><span class="mas" id="topMas">🥚</span><span>رياضياتي</span></a>
  <div class="chips" id="topChips"></div>
</div></div>
<div class="container" id="app"><div class="card hero"><div class="big-mas">🧮</div><p class="muted">لحظة… نجهز الدروس</p></div></div>
<div class="conf" id="conf"></div>
<script>
/* ============================================================
   رياضياتي — موقع تأسيس الرياضيات للأطفال (ثالث ابتدائي ← ثاني متوسط)
   كل شيء يشتغل من المتصفح: الدروس من math-lessons.json، والأسئلة من math-gen.js،
   والتقدم في localStorage (مع رمز نقل بين الأجهزة من لوحة الوالد).
   ============================================================ */
const VER = '20260913', KEY = 'mathKids.v1';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dg = (s) => MathGen.dg(s);
const localDate = (d) => { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const now = () => Date.now();
const DAY = 86400000;
let L = null, UNITS = [], UBY = {}, CONTENT = {};

/* ---------- الحالة ---------- */
function fix(s) {
  s = s || {}; s.v = 1; s.name = s.name || ''; s.avatar = s.avatar || '🦄'; s.digits = s.digits || 'ar'; s.sound = s.sound !== false;
  s.placed = !!s.placed; s.startLevel = s.startLevel || 3; s.units = s.units || {}; s.stars = s.stars || 0; s.streak = s.streak || { n: 0, last: '' };
  s.days = s.days || {}; s.mistakes = s.mistakes || []; s.badges = s.badges || {}; s.log = s.log || []; s.parentPin = s.parentPin || null; s.created = s.created || now();
  return s;
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return fix(s); } catch (e) { } return fix({}); }
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
const U = (id) => S.units[id] || (S.units[id] = { st: 'locked', stars: 0, best: 0, tries: 0, right: 0, wrong: 0, last: 0, due: 0, ivl: 0, seen: false, prac: 0 });
function day(d) { d = d || localDate(); return S.days[d] || (S.days[d] = { q: 0, right: 0, sec: 0, lesson: 0, review: 0, mission: false, mastered: 0 }); }

/* ---------- الصوت والاحتفال ---------- */
let AC = null;
function beep(ok) { if (!S.sound) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.connect(g); g.connect(AC.destination); o.type = 'sine'; const t = AC.currentTime; if (ok) { o.frequency.setValueAtTime(660, t); o.frequency.setValueAtTime(880, t + .1); g.gain.setValueAtTime(.15, t); g.gain.exponentialRampToValueAtTime(.001, t + .35); o.start(t); o.stop(t + .35); } else { o.frequency.setValueAtTime(220, t); g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .3); o.start(t); o.stop(t + .3); } } catch (e) { } }
function confetti(n) { const c = $('conf'); const cols = ['#7c3aed', '#db2777', '#f59e0b', '#0d9488', '#22c55e', '#0ea5e9']; for (let i = 0; i < (n || 40); i++) { const s = document.createElement('i'); s.style.left = Math.random() * 100 + '%'; s.style.background = cols[i % cols.length]; s.style.animationDelay = (Math.random() * .6) + 's'; c.appendChild(s); setTimeout(() => s.remove(), 2600); } }
function toast(msg, ms) { const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = msg; t.style.bottom = (18 + document.querySelectorAll('.toast').length * 54) + 'px'; document.body.appendChild(t); setTimeout(() => t.remove(), ms || 1800); }
function speak(html) { try { if (!('speechSynthesis' in window)) return; const txt = String(html).replace(/<[^>]+>/g, ' ').replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\s+/g, ' ').trim(); speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang = 'ar-SA'; u.rate = .9; const v = speechSynthesis.getVoices().find((x) => /^ar/i.test(x.lang)); if (v) u.voice = v; speechSynthesis.speak(u); } catch (e) { } }
const PRAISE = ['أحسنتِ! 🎉', 'ممتاز يا بطلة! ⭐', 'رائع! 👏', 'صح! أنتِ ذكية 🌟', 'يا سلام! 💜', 'واو! كملي 🚀', 'إجابة صحيحة! 🥳'];
const ENCOURAGE = ['ولا يهمك، جربي مرة ثانية 💪', 'قريبة! شوفي التلميح 💡', 'الغلط طريق التعلم 🌱', 'خذي نفس وحاولي كمان مرة 🌸'];

/* ---------- النجوم والمراحل والأوسمة ---------- */
const STAGES = [[0, '🥚', 'بيضة'], [15, '🐣', 'بدأت تفقس'], [50, '🐤', 'كتكوت'], [120, '🐥', 'فرخ صغير'], [250, '🐦', 'عصفور'], [450, '🦜', 'ببغاء'], [700, '🦚', 'طاووس'], [1000, '🦄', 'يونيكورن'], [1500, '🐉', 'تنين الرياضيات']];
function stage() { let s = STAGES[0], nx = null; for (let i = 0; i < STAGES.length; i++) { if (S.stars >= STAGES[i][0]) s = STAGES[i]; else { nx = STAGES[i]; break; } } return { cur: s, next: nx }; }
const BADGES = [
  ['first', '🎈', 'أول درس', () => Object.values(S.units).some((u) => u.seen)],
  ['master1', '🏆', 'أول إتقان', () => Object.values(S.units).some((u) => u.st === 'mastered')],
  ['master5', '🥇', '5 وحدات متقنة', () => Object.values(S.units).filter((u) => u.st === 'mastered').length >= 5],
  ['streak3', '🔥', '3 أيام متتالية', () => S.streak.n >= 3],
  ['streak7', '🌋', 'أسبوع كامل', () => S.streak.n >= 7],
  ['stars100', '⭐', '100 نجمة', () => S.stars >= 100],
  ['stars500', '🌟', '500 نجمة', () => S.stars >= 500],
  ['q100', '💯', '100 سؤال', () => Object.values(S.days).reduce((s, d) => s + d.q, 0) >= 100],
  ['q1000', '🧠', '1000 سؤال', () => Object.values(S.days).reduce((s, d) => s + d.q, 0) >= 1000],
  ['review10', '🔁', '10 مراجعات', () => Object.values(S.days).reduce((s, d) => s + d.review, 0) >= 50],
  ['perfect', '💎', 'اختبار كامل 10/10', () => Object.values(S.units).some((u) => u.best >= 10)],
  ['lvl3', '🏝️', 'أنهيت ثالث ابتدائي', () => levelDone(3)], ['lvl4', '🌴', 'أنهيت رابع ابتدائي', () => levelDone(4)], ['lvl5', '🏔️', 'أنهيت خامس ابتدائي', () => levelDone(5)],
  ['lvl6', '🌋', 'أنهيت سادس ابتدائي', () => levelDone(6)], ['lvl7', '🏰', 'أنهيت أول متوسط', () => levelDone(7)], ['lvl8', '👑', 'أنهيت ثاني متوسط', () => levelDone(8)],
];
function levelDone(lv) { const us = UNITS.filter((u) => u.level === lv); return us.length > 0 && us.every((u) => ['mastered', 'skipped'].includes(U(u.id).st)); }

function touchStreak() { const t = localDate(); if (S.streak.last === t) return; const y = localDate(new Date(now() - DAY)); S.streak.n = S.streak.last === y ? S.streak.n + 1 : 1; S.streak.last = t; }

/* ---------- الوحدات والترتيب ---------- */
const order = (id) => UNITS.findIndex((u) => u.id === id);
function nextUnit(id) { return UNITS[order(id) + 1] || null; }
function currentUnit() { const open = UNITS.filter((u) => U(u.id).st === 'open'); if (open.length) return open[0]; const lastDone = UNITS.map((u, i) => ['mastered', 'skipped'].includes(U(u.id).st) ? i : -1).reduce((a, b) => Math.max(a, b), -1); const nx = UNITS[lastDone + 1]; if (nx) { U(nx.id).st = 'open'; save(); return nx; } return UNITS[0]; }

/* ---------- الشرح: تحويل الكتل إلى HTML ---------- */
/* نص الشرح: [[رياضيات]] ← كتلة معزولة الاتجاه، **تشديد** ← عريض، وكل الأرقام بشكل الأرقام المختار (١٢٣ أو 123) حتى لا تختلط */
function inline(t) { return dg(esc(t).replace(/\[\[(.+?)\]\]/g, (_, m) => MathGen.M(m.replace(/(\d+)\/(\d+)/g, (__, n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`))).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')); }
function block(b) {
  const V = MathGen.V;
  if (b.hd) return `<h4>${inline(b.hd)}</h4>`;
  if (b.ex) return `<div class="ex">${MathGen.M(esc(b.ex).replace(/(\d+)\/(\d+)/g, (_, n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`))}</div>`;
  if (b.t) return `<p>${inline(b.t)}</p>`;
  let v = '';
  try {
    switch (b.v) {
      case 'fracbar': v = V.fracbar(b.n, b.d); break; case 'fracpie': v = V.fracpie(b.n, b.d); break;
      case 'numline': v = V.numline(b.min, b.max, b.marks || []); break; case 'array': v = V.array(b.r, b.c); break;
      case 'place': v = V.place(b.num); break; case 'column': v = V.column(b.op, b.a, b.b, true); break;
      case 'angle': v = V.angle(b.deg); break; case 'rect': v = V.rect(b.w, b.ht); break; case 'tri': v = V.tri(b.a, b.b, b.c); break;
      case 'bars': v = V.bars(b.labels, b.values); break; case 'grid': v = V.grid(b.points); break; case 'clock': v = V.clock(b.hh, b.mm); break;
      case 'table': v = V.table(b.rows); break; case 'steps': v = V.steps((b.items || []).map(inline)); break;
    }
  } catch (e) { v = ''; }
  return v ? `<div class="visw">${v}</div>` : '';
}

/* ---------- تحديد المستوى ---------- */
let P = null;
function placeQueue(lv, exclude) { const us = UNITS.filter((u) => u.level === lv && !(exclude || []).includes(u.id)); const pickN = exclude ? 2 : 4; const out = []; for (let i = 0; i < pickN && us.length; i++) { const idx = Math.floor(i * us.length / pickN); out.push(us[Math.min(idx, us.length - 1)]); } return out.map((u) => ({ u, q: MathGen.gen(u) })); }
function renderPlace() {

    <div class="row" style="justify-content:center"><button class="btn big" id="startP">ابدئي الاختبار 🧭</button></div><div class="row" style="justify-content:center"><a class="btn ghost sm" href="#home" id="skipP">أبدأ من ثالث ابتدائي بدون اختبار</a></div></div>`;
    $('startP').onclick = () => { P = { lv: 3, queue: placeQueue(3), asked: {}, results: {}, extra: false, i: 0 }; renderPlace(); };

    else if (r.n === 4 && r.right === 2 && !P.extra) { P.extra = true; P.queue = placeQueue(P.lv, Object.keys(P.asked).filter((id) => UBY[id].level === P.lv)); }

function finishPlace(lv) {

/* ---------- عرض سؤال والإجابة عليه ---------- */
function askQuestion(box, q, opts) {
  opts = opts || {}; let attempts = 0; const t0 = now(); let chosen = null; let locked = false;
  const numeric = q.type !== 'mc' && /^-?[\d.]+$/.test(String(q.answer)); const needKeys = q.type !== 'mc' && !numeric;
  box.innerHTML = `<div class="qtext">${q.q} <button class="speak" id="sayQ">🔊</button></div>${q.vis ? `<div class="qvis">${q.vis}</div>` : ''}
    ${q.type === 'mc' ? `<div class="opts" id="opts">${q.options.map((o, i) => `<button type="button" data-i="${i}">${o}</button>`).join('')}</div>` : `<input class="ans" id="ans" inputmode="${numeric ? 'decimal' : 'text'}" autocomplete="off" placeholder="؟">${needKeys ? `<div class="keys">${['/', '−', 'س', '(', ')', '،', ':', '%', ' '].map((k) => `<button type="button" data-k="${k}">${k === ' ' ? '␣' : k}</button>`).join('')}</div>` : `<div class="keys"><button type="button" data-k="−">−</button><button type="button" data-k=".">.</button></div>`}`}
    <div class="row" style="justify-content:center"><button class="btn" id="chk">تحقق ✓</button>${opts.noHint ? '' : `<button class="btn ghost sm" id="hintBtn">💡 تلميح</button>`}${opts.skipLabel ? `<button class="btn ghost sm" id="skipBtn">${opts.skipLabel}</button>` : ''}</div><div id="fb"></div>`;
  $('sayQ').onclick = () => speak(q.q);
  const ans = $('ans'); if (ans) { setTimeout(() => ans.focus(), 50); ans.onkeydown = (e) => { if (e.key === 'Enter') submit(); }; }
  box.querySelectorAll('.keys button').forEach((b) => b.onclick = () => { ans.value += b.dataset.k; ans.focus(); });
  box.querySelectorAll('#opts button').forEach((b) => b.onclick = () => { if (locked) return; chosen = +b.dataset.i; box.querySelectorAll('#opts button').forEach((x) => x.classList.toggle('on', x === b)); });
  if ($('hintBtn')) $('hintBtn').onclick = () => { $('fb').innerHTML = `<div class="fb h pop">💡 ${q.hint}</div>`; };
  if ($('skipBtn')) $('skipBtn').onclick = () => { locked = true; opts.onDone(false, { skipped: true, sec: (now() - t0) / 1000 }); };

  <textarea id="imp" placeholder="الصق رمز التقدم هنا"></textarea><div class="row"><button class="btn sm teal" id="doImp">استيراد</button><button class="btn sm ghost" id="reset" style="color:var(--err);border-color:var(--err)">🗑️ تصفير كل التقدم</button></div></div>`;
  $('copyRep').onclick = () => { navigator.clipboard && navigator.clipboard.writeText($('rep').value); toast('تم النسخ ✓'); };
  $('copyExp').onclick = () => { navigator.clipboard && navigator.clipboard.writeText($('exp').value); toast('تم نسخ الرمز ✓'); };
  $('doImp').onclick = () => { try { const s = JSON.parse(decodeURIComponent(escape(atob($('imp').value.trim())))); if (!s || s.v !== 1) throw 0; S = fix(s); save(); MathGen.setDigits(S.digits); toast('تم الاستيراد ✓'); renderParent(); } catch (e) { toast('الرمز غير صحيح'); } };
  $('reset').onclick = () => { if (confirm('تصفير كل التقدم والنجوم؟ لا يمكن التراجع.')) { const pin = S.parentPin; S = fix({ parentPin: pin }); save(); go('welcome'); } };
  $('replace').onclick = () => { if (confirm('إعادة اختبار تحديد المستوى ستعيد ترتيب الوحدات المفتوحة (النجوم تبقى).')) { S.placed = false; P = null; save(); go('place'); } };
  $('pinChange').onclick = () => { const v = prompt('الرقم السري الجديد (4 أرقام):'); if (v && /^\d{4}$/.test(MathGen.norm(v))) { S.parentPin = MathGen.norm(v); save(); toast('تم ✓'); } };
  document.querySelectorAll('[data-unlock]').forEach((b) => b.onclick = () => { const s = U(b.dataset.unlock); s.st = 'open'; save(); toast('تم فتح الوحدة ✓'); renderParent(); });
}

fetch('math-lessons.json?v=' + VER).then((r) => r.json()).then((j) => {
  L = j; UNITS = j.units; UNITS.forEach((u) => { UBY[u.id] = u; if (u.content) CONTENT[u.id] = u.content; });
  MathGen.setDigits(S.digits); initUnits(); save();
  window.addEventListener('hashchange', route); route();
}).catch((e) => { $('app').innerHTML = `<div class="card"><h2>تعذر تحميل الدروس</h2><p class="muted">${esc(e.message)} — أعيدي تحميل الصفحة.</p></div>`; });
