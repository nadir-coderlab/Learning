<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مذاكرة الاختبار — مدرسة البنات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<div class="loading-screen" id="loading">
  <div class="spinner"></div>
  <div>لحظة… 📚</div>
</div>

<div id="page" style="display:none">
  <div class="top">
    <div class="wrap">
      <div>
        <div class="brand">📚 مذاكرة الاختبار</div>
        <h1 id="topTitle">اختبار الإنجليزي</h1>
      </div>
      <div class="topbtns">
        <button class="tbtn" id="homeBtn">🏠 البداية</button>
      </div>
    </div>
  </div>

  <div class="container ex-wrap" id="main"></div>
</div>

<div id="toast"></div>

<script type="module">
import {
  requireSession, saveQuizResult, db, doc, getDoc, setDoc, serverTimestamp
} from "/assets/js/auth.js";
import { EXAMS, PARENT_WHATSAPP, MONTHS } from "/assets/js/exams-data.js";
import {
  esc, shuffle, indexExam, studyCardHtml, paperQuestion, explainHtml, correctHtml,
  answerText, sayText, sayBtn, buildPaperMock, scoreMock, levelFor
} from "/assets/js/exam-engine.js";
import { speak, speakAr } from "/assets/js/speech.js";
import { startTracking } from "/assets/js/tracker.js";

// ---------------------------------------------------------------
// صفحة بسيطة: زرين بس — 📖 ذاكري (سؤال سؤال مع الشرح) و 📝 اختبري نفسك (نفس الورقة)
// ---------------------------------------------------------------

const $ = (id) => document.getElementById(id);
const main = $("main");
const PRAISES = ["صح! 👏", "ممتاز! 🌟", "شطورة! 💚", "برافو! 🎉", "صح عليك! 👍"];
const praise = () => PRAISES[Math.floor(Math.random() * PRAISES.length)];
const LOCALE = "ar-SA-u-ca-gregory-nu-latn";
const NUM = ["", "الأولى", "الثانية", "الثالثة", "الرابعة", "الخامسة", "السادسة", "السابعة", "الثامنة", "التاسعة", "العاشرة"];

const exam = EXAMS[0];
const idx = indexExam(exam);
let session = null, tracker = null, prog = null, view = null;

// خطوات المذاكرة: الورقة ← الفقرة (شرح طريقة الحل) ← أسئلتها واحد واحد
const STEPS = [];
exam.papers.forEach((paper, pi) => {
  STEPS.push({ k: "paper", pi });
  paper.parts.forEach((part, ri) => {
    STEPS.push({ k: "part", pi, ri });
    part.items.forEach((id, qi) => STEPS.push({ k: "q", pi, ri, qi, id }));
  });
});
STEPS.push({ k: "end" });
const Q_TOTAL = STEPS.filter((s) => s.k === "q").length;
// عدد الأسئلة اللي خلصتها (اللي عدّتها في المذاكرة) — يُحسب من أبعد خطوة وصلت لها
const studiedCount = () => STEPS.slice(0, prog.maxPos || 0).filter((s) => s.k === "q").length;

requireSession(async (s) => {
  session = s;
  tracker = startTracking(s, "exams");
  await loadProg();
  $("loading").style.display = "none";
  $("page").style.display = "block";
  if (!prog.guideSeen) showGuide(0); else showHome();
});

// ---------------------------------------------------------------
// أدوات
// ---------------------------------------------------------------

function show(html, name) {
  view = name;
  main.innerHTML = html;
  window.scrollTo(0, 0);
}

let toastTimer;
function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.className = "show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = ""), 2500);
}

const clean = (o) => JSON.parse(JSON.stringify(o));
const fmtNum = (n) => (Math.round(n * 100) / 100).toString();
const today = () => new Date().toLocaleDateString("en-CA");
const firstName = () => session.profile?.displayName || session.profile?.username || "";

function examDateLine() {
  const d0 = new Date(today() + "T00:00:00"), d1 = new Date(exam.date + "T00:00:00");
  const d = Math.round((d1 - d0) / 86400000);
  if (d < 0) return "";
  const when = d1.toLocaleDateString(LOCALE, { weekday: "long", day: "numeric", month: "long" });
  return d === 0 ? `الاختبار اليوم! 💪` : d === 1 ? `الاختبار بكرة (${when}) 🔥` : `الاختبار ${when}`;
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-say]");
  if (!b) return;
  e.preventDefault();
  e.stopPropagation();
  speak(b.dataset.say, { rate: 0.7 });
}, true);

// ---------------------------------------------------------------
// حفظ التقدم (الجهاز + Firestore eduSkills/{uid}.exams.{examId})
// ---------------------------------------------------------------

const lsKey = () => `examprep2:${session.user.uid}:${exam.id}`;
const skillsRef = () => doc(db, "eduSkills", session.user.uid);

async function loadProg() {
  let local = null, remote = null;
  try { local = JSON.parse(localStorage.getItem(lsKey()) || "null"); } catch (e) { /* تجاهل */ }
  try {
    const snap = await getDoc(skillsRef());
    const r = snap.exists() ? snap.data().exams?.[exam.id] : null;
    remote = r && r.v === 2 ? r : null;
  } catch (e) { console.warn("تعذر تحميل التقدم:", e); }
  const best = [remote, local].filter(Boolean).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0];
  prog = { v: 2, guideSeen: false, pos: 0, maxPos: 0, first: {}, mocks: [], updatedAt: 0, ...(best || {}) };
  prog.first = prog.first || {};
  prog.mocks = Array.isArray(prog.mocks) ? prog.mocks : [];
}

let saveTimer = null;
function saveProg(now = false) {
  prog.updatedAt = Date.now();
  prog.maxPos = Math.max(prog.maxPos || 0, prog.pos || 0);
  prog.studied = studiedCount();
  prog.total = Q_TOTAL;
  try { localStorage.setItem(lsKey(), JSON.stringify(prog)); } catch (e) { /* تجاهل */ }
  clearTimeout(saveTimer);
  const go = () => setDoc(skillsRef(), {
    uid: session.user.uid,
    username: session.profile?.username || "",
    displayName: session.profile?.displayName || "",
    exams: { [exam.id]: clean(prog) },
    updatedAt: serverTimestamp()
  }, { merge: true }).catch((e) => console.warn("تعذر حفظ التقدم:", e));
  if (now) return go();
  saveTimer = setTimeout(go, 1500);
}
window.addEventListener("pagehide", () => { if (prog) saveProg(true); tracker?.stop(); });

// ---------------------------------------------------------------
// البداية
// ---------------------------------------------------------------

function showHome() {
  window.speechSynthesis?.cancel();
  const studied = studiedCount();
  const pct = Math.round((100 * studied) / Q_TOTAL);
  const atStart = prog.pos === 0;
  const finished = STEPS[prog.pos]?.k === "end";
  const lm = prog.mocks[prog.mocks.length - 1];
  show(`
    <div class="hello-card">
      <div class="hello">أهلًا ${esc(firstName())} ${session.profile?.avatar || "🌸"}</div>
      <div class="hello-sub">${examDateLine()}</div>
    </div>

    <button class="big-choice study" data-act="study">
      <span class="bc-ic">📖</span>
      <span class="bc-t">${atStart ? "ذاكري" : finished ? "ذاكري مرة ثانية" : "كمّلي المذاكرة"}</span>
      <span class="bc-s">${atStart ? "أشرح لك الأوراق سؤال سؤال بالعربي" : finished ? "خلصتي كل الأسئلة 🎉" : `وصلتي للسؤال ${Math.min(STEPS.slice(0, prog.pos).filter((x) => x.k === "q").length + 1, Q_TOTAL)} من ${Q_TOTAL}`}</span>
    </button>

    <button class="big-choice test" data-act="testmenu">
      <span class="bc-ic">📝</span>
      <span class="bc-t">اختبري نفسك</span>
      <span class="bc-s">${lm ? `آخر درجة: ${fmtNum(lm.score)} من ${lm.outOf}` : "حلي الورقة لحالك وشوفي درجتك"}</span>
    </button>

    <div class="home-progress">
      <div class="pbar"><div style="width:${pct}%"></div></div>
      <div>ذاكرتي <b>${studied}</b> من <b>${Q_TOTAL}</b> سؤال</div>
    </div>

    <div class="home-links">
      <button class="linkbtn" data-act="guide">❓ كيف أستخدم الموقع؟</button>
      ${!atStart ? `<button class="linkbtn" data-act="restart">🔄 ابدئي المذاكرة من الأول</button>` : ""}
    </div>`, "home");
}

// ---------------------------------------------------------------
// شرح طريقة الاستخدام (أول مرة)
// ---------------------------------------------------------------

const GUIDE = [
  { ic: "👋", t: "أهلًا! هذا الموقع يساعدك تذاكرين اختبار الإنجليزي.", s: "فيه زرين بس: <b>📖 ذاكري</b> و <b>📝 اختبري نفسك</b>" },
  { ic: "📖", t: "في «ذاكري» نمشي مع الأوراق اللي عندك، سؤال سؤال.", s: "أقولك وش معنى السؤال بالعربي، و<b class=\"ans\">الجواب الصح باللون الأخضر</b>" },
  { ic: "🔊", t: "اضغطي الزر 🔊 عشان تسمعين الكلمة بالإنجليزي.", s: "وبعد كل سؤال اضغطي <b>«جربي بنفسك»</b> واختاري الجواب" },
  { ic: "📝", t: "لما تخلصين، ادخلي «اختبري نفسك» وحلي الورقة لحالك.", s: "في الآخر تطلع درجتك، وترسلينها لبابا 📤" }
];

function showGuide(i) {
  const g = GUIDE[i];
  const last = i === GUIDE.length - 1;
  show(`
    <div class="guide-card">
      <div class="guide-step">${i + 1} من ${GUIDE.length}</div>
      <div class="guide-ic">${g.ic}</div>
      <div class="guide-t">${g.t}</div>
      <div class="guide-s">${g.s}</div>
      <div class="dots">${GUIDE.map((_, k) => `<span class="dot ${k === i ? "on" : k < i ? "past" : ""}"></span>`).join("")}</div>
      <div class="lnav">
        ${i > 0 ? `<button class="btn ghost" data-act="guideprev">رجوع</button>` : "<span></span>"}
        <button class="btn big-go" data-act="${last ? "guidedone" : "guidenext"}">${last ? "فهمت، يلا نبدأ ✅" : "التالي ◀"}</button>
      </div>
    </div>`, "guide");
  view = { name: "guide", i };
  speakAr(g.t.replace(/[«»]/g, ""));
}

// ---------------------------------------------------------------
// المذاكرة
// ---------------------------------------------------------------

function crumbs(st) {
  const paper = exam.papers[st.pi];
  const part = st.ri != null ? paper.parts[st.ri] : null;
  return `<div class="crumbs"><b>📄 ${esc(paper.name)}</b>${part ? ` · الفقرة ${st.ri + 1} من ${paper.parts.length}` : ""}</div>`;
}

function studyNav(mainBtn) {
  return `<div class="lnav">
    ${prog.pos > 0 ? `<button class="btn ghost" data-act="sback">رجوع</button>` : "<span></span>"}
    ${mainBtn}
  </div>`;
}

function showStudy(phase = "learn") {
  const st = STEPS[prog.pos];
  const studied = studiedCount();
  const bar = `<div class="pbar thin"><div style="width:${Math.round((100 * studied) / Q_TOTAL)}%"></div></div>`;

  if (st.k === "end") {
    show(`
      <div class="guide-card">
        <div class="guide-ic">🎉</div>
        <div class="guide-t">خلصتي مذاكرة كل الأوراق! ما شاء الله عليك</div>
        <div class="guide-s">الحين جربي تحلين الورقة لحالك 💪</div>
        <button class="btn big-go" data-act="testmenu">📝 اختبري نفسك</button>
        <div style="margin-top:12px"><button class="linkbtn" data-act="home">🏠 البداية</button></div>
      </div>`, "study");
    speakAr("ما شاء الله! خلصتي المذاكرة. الحين اختبري نفسك");
    return;
  }

  const paper = exam.papers[st.pi];

  if (st.k === "paper") {
    const n = paper.parts.reduce((a, p) => a + p.items.length, 0);
    show(`${bar}
      <div class="guide-card">
        <div class="guide-ic">📄</div>
        <div class="guide-t">${esc(paper.name)}</div>
        <div class="guide-s">هذي نفس ${esc(paper.name)} اللي عندك في الملف.<br>فيها <b>${paper.parts.length}</b> فقرات و <b>${n}</b> سؤال.</div>
        ${studyNav(`<button class="btn big-go" data-act="snext">يلا نبدأ ◀</button>`)}
      </div>`, "study");
    speakAr(`${paper.name}. يلا نبدأ`);
    return;
  }

  const part = paper.parts[st.ri];

  if (st.k === "part") {
    show(`${bar}${crumbs(st)}
      <div class="xcard part-card">
        <div class="part-t">${esc(part.t)}</div>
        <div class="st-label">📄 في الورقة مكتوب:</div>
        <div class="paper mini">
          ${part.h ? `<div class="exam-h en">${esc(part.h)}</div>` : ""}
          ${part.sub ? `<div class="exam-sub en">${esc(part.sub)}</div>` : ""}
        </div>
        ${part.box ? `<div class="st-label">📦 المربع اللي في الورقة:</div><div class="wordbox-wrap"><div class="wordbox en">${part.box.map(esc).join(" – ")}</div></div>` : ""}
        <div class="st-label">✍️ كيف أحلها؟</div>
        <ol class="how-list">${part.how.map((h) => `<li>${esc(h)}</li>`).join("")}</ol>
        <div class="xmean">فيها <b>${part.items.length}</b> أسئلة. يلا نشوفها واحد واحد 👇</div>
      </div>
      ${studyNav(`<button class="btn big-go" data-act="snext">فهمت ◀</button>`)}`, "study");
    speakAr(`${part.t.replace(/[^؀-ۿ\s]/g, "")}. كيف أحلها؟ ${part.how.join(" ").replace(/[^؀-ۿ\s.،]/g, " ")}`);
    return;
  }

  // سؤال
  const it = idx.items[st.id];
  const head = `${bar}${crumbs(st)}<div class="q-title">${esc(part.t)} · سؤال ${st.qi + 1} من ${part.items.length}</div>`;

  if (phase === "learn") {
    show(`${head}
      <div class="xcard">${studyCardHtml(it)}</div>
      ${studyNav(`<button class="btn big-go" data-act="stry">جربي بنفسك 👆</button>`)}`, "study");
    speak(sayText(it), { rate: 0.7 });
    return;
  }

  // جربي بنفسك
  const q = paperQuestion(it, part, idx, false);
  show(`${head}
    <div class="try-title">يلا جربي! 👇</div>
    <div class="qcard" id="qcard"></div>
    <div id="fb"></div>
    <div class="lnav"><button class="btn ghost" data-act="slearn">👀 شوفي الشرح مرة ثانية</button><span></span></div>`, "study");
  renderQuestion($("qcard"), q, it, {
    mock: false,
    onAnswer: ({ ok }) => {
      if (!(it.id in prog.first)) { prog.first[it.id] = ok; saveProg(); }
      if (ok) {
        const p = praise();
        $("fb").innerHTML = `<div class="feedback ok">${p}</div>
          <div class="lnav"><span></span><button class="btn big-go" data-act="snext">التالي ◀</button></div>`;
        speakAr(p.replace(/[^؀-ۿ\s!]/g, ""));
      } else {
        $("fb").innerHTML = `<div class="feedback no">🙈 مو صح — عادي!<div class="fb-right">الجواب الصح: ${correctHtml(it)} ${sayBtn(sayText(it))}</div>
          <div class="lnav"><span></span><button class="btn big-go" data-act="stry">حاولي مرة ثانية 🔁</button></div></div>`;
        speakAr("مو صح، عادي. شوفي الجواب الأخضر وحاولي مرة ثانية");
      }
      $("fb").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  });
}

function studyNext() {
  const st = STEPS[prog.pos];
  // نهاية ورقة: نحفظ ملخصها لبابا
  if (st.k === "q") {
    const nxt = STEPS[prog.pos + 1];
    if (!nxt || nxt.k === "paper" || nxt.k === "end") saveStudyResult(st.pi);
  }
  prog.pos = Math.min(prog.pos + 1, STEPS.length - 1);
  saveProg();
  showStudy("learn");
}

async function saveStudyResult(pi) {
  const paper = exam.papers[pi];
  const ids = paper.parts.flatMap((p) => p.items);
  const done = ids.filter((id) => id in prog.first);
  if (!done.length) return;
  const correct = done.filter((id) => prog.first[id]).length;
  try {
    await saveQuizResult(session, clean({
      type: "examPractice", examId: exam.id, examTitle: exam.titleAr,
      lessonId: paper.id, lessonName: `مذاكرة ${paper.name}`,
      total: done.length, correct, pct: Math.round((100 * correct) / done.length), durationSec: 0,
      details: done.map((id) => ({ letter: answerText(idx.items[id]), correct: !!prog.first[id], chosen: "" }))
    }));
  } catch (e) { console.warn("تعذر حفظ ملخص المذاكرة:", e); }
}

// ---------------------------------------------------------------
// عرض السؤال (بالضغط فقط)
// ---------------------------------------------------------------

function doLine(q, it) {
  if (q.kind === "build") return "";
  return {
    qa: "👆 اختاري الجواب الصح",
    tf: "👆 صح ✓ ولا خطأ ✗ ؟",
    spell: "👆 اختاري الحرف الناقص",
    complete: "👆 اختاري الكلمة اللي تكمّل الجملة",
    choose: "👆 اختاري الكلمة الصح للفراغ"
  }[it.type] || "";
}

function renderQuestion(box, q, it, { mock, onAnswer }) {
  let answered = false;
  const line = doLine(q, it);
  box.innerHTML = `<div class="qhead">${q.head}</div>${line ? `<div class="do-line">${line}</div>` : ""}<div class="qbody"></div>`;
  const body = box.querySelector(".qbody");

  if (q.kind === "choice") {
    const opts = q.keepOrder ? q.options : shuffle(q.options);
    body.innerHTML = `<div class="opt-list ${q.row ? "row" : ""}">${opts.map((o, i) => `<button type="button" class="xopt ${o.cls}" data-i="${i}">${o.html}</button>`).join("")}</div>`;
    const btns = [...body.querySelectorAll(".xopt")];
    btns.forEach((b) => b.addEventListener("click", () => {
      if (answered) return;
      answered = true;
      const o = opts[+b.dataset.i];
      const ok = o.val === q.answer;
      btns.forEach((x) => (x.disabled = true));
      if (mock) b.classList.add("picked");
      else {
        b.classList.add(ok ? "correct" : "wrong");
        if (!ok) btns.forEach((x, j) => { if (opts[j].val === q.answer) x.classList.add("correct"); });
      }
      onAnswer({ ok, chosen: o.cls.includes("tf") ? o.html : o.val });
    }));
    return;
  }

  // ترتيب الكلمات بالضغط
  const joiner = q.joiner || " ";
  let picked = [];
  body.innerHTML = `
    <div class="build-line" data-line></div>
    <div class="chips" data-chips></div>
    <div class="card-actions">
      <button type="button" class="btn ghost small" data-clear>↺ امسحي</button>
      <button type="button" class="btn" data-go disabled>${mock ? "التالي ◀" : "تأكدي ✓"}</button>
    </div>`;
  const lineEl = body.querySelector("[data-line]"), chips = body.querySelector("[data-chips]"), go = body.querySelector("[data-go]");
  const draw = () => {
    lineEl.innerHTML = picked.length
      ? picked.map((ci, k) => `<button type="button" class="chip in" data-k="${k}">${esc(q.chips[ci])}</button>`).join("") + (picked.length === q.chips.length && q.end ? `<span class="chip-end">${esc(q.end)}</span>` : "")
      : `<span class="build-ph">اضغطي على الكلمات اللي تحت بالترتيب 👇</span>`;
    chips.innerHTML = q.chips.map((c, ci) => `<button type="button" class="chip ${picked.includes(ci) ? "used" : ""}" data-ci="${ci}" ${picked.includes(ci) ? "disabled" : ""}>${esc(c)}</button>`).join("");
    go.disabled = answered || picked.length !== q.chips.length;
  };
  chips.addEventListener("click", (e) => {
    const b = e.target.closest("[data-ci]");
    if (!b || answered) return;
    picked.push(+b.dataset.ci);
    speak(q.chips[+b.dataset.ci], { rate: 0.8 });
    draw();
  });
  lineEl.addEventListener("click", (e) => {
    const b = e.target.closest("[data-k]");
    if (!b || answered) return;
    picked.splice(+b.dataset.k, 1);
    draw();
  });
  body.querySelector("[data-clear]").addEventListener("click", () => { if (!answered) { picked = []; draw(); } });
  go.addEventListener("click", () => {
    if (answered || picked.length !== q.chips.length) return;
    answered = true;
    const words = picked.map((ci) => q.chips[ci]);
    const ok = words.join(joiner) === q.target.join(joiner);
    if (!mock) lineEl.classList.add(ok ? "ok" : "no");
    draw();
    onAnswer({ ok, chosen: words.join(joiner) + (q.end || "") });
  });
  draw();
}

// ---------------------------------------------------------------
// اختبري نفسك
// ---------------------------------------------------------------

let test = null;

function showTestMenu() {
  test = null;
  window.speechSynthesis?.cancel();
  show(`
    <div class="guide-card">
      <div class="guide-ic">📝</div>
      <div class="guide-t">اختاري الورقة اللي تبين تحلينها</div>
      <div class="guide-s">حلي لحالك بدون مساعدة. الدرجة تطلع في الآخر 💪</div>
    </div>
    <div class="mock-list">
      ${exam.papers.map((p) => {
        const n = p.parts.reduce((a, x) => a + x.items.length, 0);
        const l = prog.mocks.filter((m) => m.kind === p.id).slice(-1)[0];
        return `<button class="big-choice paper-choice" data-act="test" data-k="${p.id}">
          <span class="bc-ic">📄</span>
          <span class="bc-t">${esc(p.name)}</span>
          <span class="bc-s">${n} سؤال${p.marks ? ` · الدرجة من ${p.marks}` : ""}${l ? ` · آخر درجة: ${fmtNum(l.score)} من ${l.outOf}` : ""}</span>
        </button>`;
      }).join("")}
    </div>`, "testmenu");
}

function startTest(kind) {
  const mock = buildPaperMock(exam, idx, kind);
  const flat = [];
  mock.parts.forEach((p, pi) => p.qs.forEach((q) => flat.push({ q, pi })));
  test = { mock, flat, i: 0, answers: [], startedAt: Date.now(), done: false };
  showTestQ();
}

function showTestQ() {
  const { q, pi } = test.flat[test.i];
  const p = test.mock.parts[pi];
  const it = idx.items[q.itemId];
  show(`
    <div class="crumbs"><b>📝 ${esc(test.mock.title)}</b> · سؤال ${test.i + 1} من ${test.flat.length}
      <button class="linkbtn" data-act="testquit" style="float:left">✕ خروج</button></div>
    <div class="pbar thin"><div style="width:${Math.round((100 * test.i) / test.flat.length)}%"></div></div>
    <div class="paper">
      <div class="part-t sm">${esc(p.t)}</div>
      ${p.h ? `<div class="exam-h en">${esc(p.h)}</div>` : ""}
      ${p.sub ? `<div class="exam-sub en">${esc(p.sub)}</div>` : ""}
      <div class="qcard flat" id="qcard"></div>
    </div>`, "test");
  renderQuestion($("qcard"), q, it, {
    mock: true,
    onAnswer: ({ ok, chosen }) => {
      test.answers.push({ part: pi, itemId: q.itemId, ok, chosen: String(chosen ?? "") });
      setTimeout(() => {
        test.i++;
        if (test.i < test.flat.length) showTestQ(); else finishTest();
      }, q.kind === "choice" ? 300 : 0);
    }
  });
}

async function finishTest() {
  test.done = true;
  const res = scoreMock(test.mock, test.answers);
  const wrong = test.answers.filter((a) => !a.ok);
  const durationSec = Math.round((Date.now() - test.startedAt) / 1000);
  const entry = {
    kind: test.mock.kind, title: test.mock.title, score: res.score, outOf: res.outOf, pct: res.pct,
    parts: res.parts.map((p) => ({ h: p.h, t: p.t, c: p.c, n: p.n, got: p.got, marks: p.marks })),
    wrong: [...new Set(wrong.map((a) => a.itemId))], ts: Date.now(), durationSec
  };
  prog.mocks = [...prog.mocks, entry].slice(-15);
  saveProg(true);
  showResult(entry, wrong);
  speakAr(res.pct >= 90 ? "ما شاء الله! جاهزة للاختبار" : res.pct >= 70 ? "ممتاز! باقي شوي" : "أحسنتِ! شوفي أخطائك وذاكريها");
  try {
    await saveQuizResult(session, clean({
      type: "exam", examId: exam.id, examTitle: exam.titleAr,
      mockKind: entry.kind, mockName: entry.title, score: entry.score, outOf: entry.outOf,
      total: test.answers.length, correct: test.answers.filter((a) => a.ok).length, pct: entry.pct,
      parts: entry.parts, durationSec,
      details: test.answers.map((a) => ({ letter: answerText(idx.items[a.itemId]), correct: a.ok, chosen: a.chosen }))
    }));
    const el = $("saveState"); if (el) el.textContent = "تم حفظ الدرجة ✅";
  } catch (e) {
    const el = $("saveState"); if (el) el.textContent = "";
  }
}

// كلام قصير يوصف السؤال (للأخطاء ولرسالة الواتساب)
function promptOf(it) {
  switch (it.type) {
    case "qa": return it.q;
    case "order": return it.words.join(" – ");
    case "month": return `${it.m}- ?`;
    case "monthOrder": return it.given.join(" – ");
    case "pair": return it.kind === "opp" ? `${it.w} ≠ ?` : it.kind === "un" ? `un + ${it.w}` : it.dir === "rev" ? `? → ${it.w}` : `${it.w} → ?`;
    case "tf": return it.s;
    case "pick2": return it.opts.join(" / ");
    case "complete": return it.s;
    case "choose": return it.s.replace("___", "( " + it.opts.join(" / ") + " )");
    case "word": return `صورة: ${it.ar}`;
    case "spell": return it.shape;
  }
  return it.id;
}
function answerShort(it) {
  if (it.type === "spell") return `${it.w} (${it.letter})`;
  if (it.type === "tf") return it.answer ? "✓" : "✗";
  if (it.type === "month") return MONTHS[it.m - 1].en;
  return answerText(it);
}

function waText(entry) {
  const p = session.profile || {};
  const lv = levelFor(entry.pct);
  const lines = [
    `📚 ${firstName()} ${p.avatar || ""} — اختبار الإنجليزي`.trim(),
    `📝 ${entry.title}: ${fmtNum(entry.score)} من ${entry.outOf} (${entry.pct}%)`,
    `المستوى: ${lv.icon} ${lv.label}`,
    `📖 المذاكرة: خلصت ${studiedCount()} من ${Q_TOTAL} سؤال`
  ];
  const wrongIds = entry.wrong || [];
  if (wrongIds.length) {
    lines.push("", `❌ غلطت في ${wrongIds.length} أسئلة — والصح:`);
    wrongIds.slice(0, 12).forEach((id) => { const it = idx.items[id]; if (it) lines.push(`• ${promptOf(it)} ← ${answerShort(it)}`); });
  } else {
    lines.push("", "🎉 ولا غلطة!");
  }
  return lines.join("\n");
}

function waLink(text) {
  const num = String(PARENT_WHATSAPP || "").replace(/\D/g, "");
  return `https://wa.me/${num}?text=${encodeURIComponent(text)}`;
}

function showResult(entry, wrong) {
  const lv = levelFor(entry.pct);
  const seen = new Set();
  const list = wrong.filter((a) => !seen.has(a.itemId) && seen.add(a.itemId)).map((a) => {
    const it = idx.items[a.itemId];
    const pic = it.pic ? `<img class="spic" src="${esc(it.pic)}" alt="">` : "";
    return `<div class="wrow">
      <div class="wq">${pic}<span class="en">${esc(promptOf(it))}</span></div>
      <div class="wyou">جوابك: <span class="bad en">${esc(a.chosen || "—")}</span></div>
      ${explainHtml(it)}
    </div>`;
  }).join("");
  show(`
    <div class="big-card result">
      <div style="font-size:60px">${lv.icon}</div>
      <div class="score-big"><span class="en">${fmtNum(entry.score)}</span> <small>من ${entry.outOf}</small></div>
      <div class="word">${lv.label}</div>
      <div class="lname" id="saveState" style="font-size:13px"></div>
    </div>
    <div class="card-actions">
      <a class="btn wa big-go" href="${waLink(waText(entry))}" target="_blank" rel="noopener">📤 أرسلي درجتك لبابا</a>
    </div>
    ${seen.size ? `<div class="panel" style="margin-top:16px"><h2>❌ الأسئلة اللي غلطتي فيها — وهذا الصح 💚</h2>${list}</div>`
      : `<div class="alert ok" style="text-align:center; font-size:18px; margin-top:16px">🎉 ولا غلطة! ما شاء الله عليك</div>`}
    <div class="card-actions">
      <button class="btn ghost" data-act="testmenu">📝 ورقة ثانية</button>
      <button class="btn ghost" data-act="home">🏠 البداية</button>
    </div>`, "result");
}

// ---------------------------------------------------------------
// الأزرار
// ---------------------------------------------------------------

const ACTS = {
  home: () => showHome(),
  guide: () => showGuide(0),
  guidenext: () => showGuide(view.i + 1),
  guideprev: () => showGuide(view.i - 1),
  guidedone: () => { prog.guideSeen = true; saveProg(); showHome(); },
  study: () => {
    if (STEPS[prog.pos]?.k === "end") { prog.pos = 0; saveProg(); }
    showStudy("learn");
  },
  restart: () => {
    if (!confirm("تبين تبدين المذاكرة من أول سؤال؟")) return;
    prog.pos = 0;
    saveProg();
    showStudy("learn");
  },
  snext: () => studyNext(),
  sback: () => { prog.pos = Math.max(0, prog.pos - 1); saveProg(); showStudy("learn"); },
  stry: () => showStudy("try"),
  slearn: () => showStudy("learn"),
  testmenu: () => showTestMenu(),
  test: (d) => startTest(d.k),
  testquit: () => { if (confirm("تبين تطلعين من الاختبار؟ الدرجة ما راح تنحفظ")) showTestMenu(); }
};

main.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || !main.contains(b)) return;
  ACTS[b.dataset.act]?.(b.dataset, b);
});

$("homeBtn").addEventListener("click", () => {
  if (view === "test" && test && !test.done && !confirm("تبين تطلعين من الاختبار؟ الدرجة ما راح تنحفظ")) return;
  if (view === "home") { location.href = "/"; return; }
  showHome();
});
</script>
